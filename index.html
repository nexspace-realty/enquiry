<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:description" content="Tell us what you are looking for to buy or rent, and our team will be in touch. ลงทะเบียนความสนใจ ซื้อ / เช่า">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one calm column on a white page, sized for an iPad in portrait; big touch targets, section labels like the paper form. Single light look by choice. */
:root{
  --bg:#ffffff; --paper:#ffffff; --ink:#1a2140; --muted:#5d6584; --line:#d5d9e6;
  --navy:#1f2f8f; --navy-soft:#eef0fa; --ok:#1f7a4d; --err:#b3261e;
  --display:"Jost", "Noto Sans Thai", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --body:"Jost", "Noto Sans Thai", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.langbar{display:flex;justify-content:flex-end}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden}
.seg button{min-height:44px;padding:0 20px;border:0;background:transparent;color:var(--navy);font-size:16px;font-family:var(--body)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sheet{background:var(--paper);border:2px solid var(--navy);border-radius:4px;padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:30px}
header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand{font-size:13px;letter-spacing:.28em;font-weight:500;color:var(--navy);text-transform:uppercase}
h1{font-family:var(--display);font-weight:300;font-size:clamp(28px,5vw,40px);letter-spacing:.06em;margin:0;text-wrap:balance}
html[lang="th"] h1{letter-spacing:0;font-weight:400}
.lead{color:var(--muted);margin:0;font-size:15px}
section{display:flex;flex-direction:column;gap:14px}
.label{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
html[lang="th"] .label{letter-spacing:.02em;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;color:var(--muted)}
.req{color:var(--navy)}
input[type=text],input[type=tel],input[type=email],textarea{
  font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);
  padding:10px 2px;border-radius:0;width:100%;outline:none;-webkit-appearance:none;appearance:none}
textarea{border:1.5px solid var(--line);border-radius:6px;padding:12px;min-height:96px;resize:vertical}
input:focus,textarea:focus{border-color:var(--navy)}
.field.invalid input{border-color:var(--err)}
.hint{font-size:13px;color:var(--err)}
.phone{display:grid;grid-template-columns:120px 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:64px;padding:0 20px;
  border:1.5px solid var(--line);border-radius:999px;font-size:17px;user-select:none;transition:background .15s,border-color .15s;background:#fff}
.chip input:checked + span{background:var(--navy);border-color:var(--navy);color:#fff}
.chip input:focus-visible + span{outline:3px solid var(--navy-soft);outline-offset:2px}
.panel{border:1.5px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--navy-soft)}
.panel h3{margin:0;font-weight:500;font-size:17px}
.money{display:flex;align-items:center;gap:10px}
.money .unit{font-size:14px;color:var(--muted);white-space:nowrap}
.sig-box{border:1.5px dashed var(--line);border-radius:10px;position:relative;touch-action:none;background:#fff}
#sig{display:block;width:100%;height:170px}
.sig-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--muted)}
.consent input{width:26px;height:26px;flex:none;accent-color:var(--navy);margin-top:1px}
button{font:inherit;cursor:pointer}
.btn{min-height:56px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-size:18px;font-weight:500;letter-spacing:.04em;padding:0 32px}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn:focus-visible,.link:focus-visible,.seg button:focus-visible{outline:3px solid #b9c2ef;outline-offset:3px}
.link{background:none;border:0;color:var(--navy);font-size:14px;padding:6px 0;text-decoration:underline}
.actions{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.formerr{color:var(--err);font-size:15px;text-align:center}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.staff{border-top:1px dashed var(--line);padding-top:22px}
.staff .label{color:var(--muted)}
.done{text-align:center;align-items:center}
.tick{width:72px;height:72px;border-radius:50%;background:var(--navy-soft);display:grid;place-items:center;color:var(--navy);font-size:34px}
.done h2{font-weight:400;font-size:28px;margin:0}
.done p{margin:0;color:var(--muted);max-width:52ch}
.send{width:100%;max-width:520px;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.send ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink);font-size:15px}
.rcpt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rcpt code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--navy-soft);padding:6px 10px;border-radius:6px;user-select:all;word-break:break-all}
.status{font-size:14px;min-height:20px}
.status.ok{color:var(--ok)} .status.bad{color:var(--err)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.sending{position:fixed;inset:0;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:20;text-align:center;padding:24px}
.sending div{display:flex;flex-direction:column;gap:14px;align-items:center;color:var(--ink);font-size:18px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--navy-soft);border-top-color:var(--navy);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <div class="seg" role="group" aria-label="Language / ภาษา">
      <button type="button" id="lang-en" aria-pressed="true">English</button>
      <button type="button" id="lang-th" aria-pressed="false">ภาษาไทย</button>
    </div>
  </div>

  <form id="f" class="sheet" novalidate autocomplete="on">
    <header>
      <div class="brand">Nexspace Realty</div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
    </header>

    <section>
      <div class="label" data-t="secClient"></div>
      <div class="grid">
        <div class="field" data-req><label for="first"><span data-t="first"></span> <span class="req">*</span></label><input id="first" type="text" autocomplete="given-name" autocapitalize="words"></div>
        <div class="field" data-req><label for="last"><span data-t="last"></span> <span class="req">*</span></label><input id="last" type="text" autocomplete="family-name" autocapitalize="words"></div>
        <div class="field" data-req style="grid-column:1/-1"><label for="phone"><span data-t="phone"></span> <span class="req">*</span></label>
          <div class="phone">
            <input id="cc" type="tel" value="+66" inputmode="tel" aria-label="Country code">
            <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="81 234 5678">
          </div>
        </div>
        <div class="field"><label for="email" data-t="email"></label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <div class="field"><label for="chat" data-t="chat"></label><input id="chat" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"></div>
      </div>
      <div class="field"><label data-t="pref"></label>
        <div class="chips" id="pref">
          <label class="chip"><input type="checkbox" value="Phone call"><span data-t="prefCall"></span></label>
          <label class="chip"><input type="checkbox" value="LINE"><span>LINE</span></label>
          <label class="chip"><input type="checkbox" value="WhatsApp"><span>WhatsApp</span></label>
          <label class="chip"><input type="checkbox" value="Email"><span data-t="prefEmail"></span></label>
        </div>
      </div>
    </section>

    <section>
      <div class="label" data-t="secType"></div>
      <div class="chips" id="ptype">
        <label class="chip"><input type="checkbox" value="Condominium"><span data-t="condo"></span></label>
        <label class="chip"><input type="checkbox" value="House / Townhouse"><span data-t="house"></span></label>
      </div>
    </section>

    <section>
      <div class="label"><span data-t="secIntent"></span> <span class="req">*</span></div>
      <div class="chips" id="intent">
        <label class="chip"><input id="wantBuy" type="checkbox" value="buy"><span data-t="buy"></span></label>
        <label class="chip"><input id="wantRent" type="checkbox" value="rent"><span data-t="rent"></span></label>
      </div>
      <div class="hint" id="intentHint" data-t="intentHint" hidden></div>

      <div class="panel" id="buyPanel" hidden>
        <h3 data-t="buy"></h3>
        <div class="field"><label data-t="beds"></label><div class="chips" data-beds="buy"></div></div>
        <div class="field"><label for="buyBudget" data-t="budget"></label>
          <div class="money"><input id="buyBudget" type="text" inputmode="numeric" placeholder="5,000,000"><span class="unit" data-t="thb"></span></div></div>
      </div>

      <div class="panel" id="rentPanel" hidden>
        <h3 data-t="rent"></h3>
        <div class="field"><label data-t="beds"></label><div class="chips" data-beds="rent"></div></div>
        <div class="field"><label for="rentBudget" data-t="budgetMonth"></label>
          <div class="money"><input id="rentBudget" type="text" inputmode="numeric" placeholder="25,000"><span class="unit" data-t="thbMonth"></span></div></div>
      </div>
    </section>

    <section>
      <div class="label" data-t="secNotes"></div>
      <div class="field"><label for="notes" data-t="notesHint"></label><textarea id="notes"></textarea></div>
    </section>

    <section>
      <div class="label" data-t="secSig"></div>
      <div class="sig-box"><canvas id="sig" aria-label="Signature"></canvas></div>
      <div class="sig-row"><span data-t="sigHint"></span><button type="button" class="link" id="sigClear" data-t="clear"></button></div>
      <label class="consent"><input id="consent" type="checkbox"><span data-t="consent"></span></label>
      <div class="hint" id="consentHint" data-t="consentHint" hidden></div>
    </section>

    <div class="actions">
      <div class="formerr" id="formErr" hidden></div>
      <button class="btn" type="submit" id="submitBtn" data-t="submit"></button>
    </div>

    <footer><span>Nexspace Realty Co., Ltd · +66 64 164 2459 · LINE @NEXSPACE</span><span id="today"></span></footer>
  </form>
</div>

<!-- Hidden form that actually delivers the enquiry by email -->
<form id="mailer" action="https://formsubmit.co/nathita.t@nexspace-realty.com" method="POST" enctype="multipart/form-data" hidden>
  <input type="hidden" name="_cc" value="piriya.t@nexspace-realty.com">
  <input type="hidden" name="_subject" id="m_subject" value="New enquiry">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" id="m_next" value="">
  <input type="text" name="_honey" tabindex="-1" autocomplete="off">
  <div id="m_fields"></div>
  <input type="file" name="attachment" id="m_file" accept="application/pdf">
</form>

<div class="sending" id="sending" hidden><div><span class="spin" aria-hidden="true"></span><span id="sendingText"></span></div></div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  const T = {
    en:{
      title:"ENQUIRY REGISTRATION", lead:"Please share a few details about what you are looking for and our team will be in touch.",
      secClient:"Your details", first:"First name", last:"Last name", phone:"Phone number", email:"Email", chat:"LINE / WhatsApp ID",
      pref:"Best way to reach you", prefCall:"Phone call", prefEmail:"Email",
      secIntent:"I am interested to", buy:"Buy", rent:"Rent", intentHint:"Please choose Buy, Rent, or both.",
      beds:"Bedrooms", budget:"Budget", budgetMonth:"Budget per month", thb:"THB", thbMonth:"THB / month",
      bedNames:["Studio","1 Bed","2 Beds","3 Beds","4+ Beds"],
      secType:"Property type", condo:"Condominium", house:"House / Townhouse",
      secNotes:"Additional conditions", notesHint:"Preferred area, move-in date, pets, parking, anything else",
      secSig:"Signature", sigHint:"Sign with your finger", clear:"Clear",
      consent:"I agree that Nexspace Realty Co., Ltd may keep these details and contact me about properties that match my enquiry.",
      consentHint:"Please tick the box to continue.",
      formErr:"Some required details are missing. They are marked in red above.", pdfErr:"Something went wrong. Please try again, or contact us on LINE @NEXSPACE.",
      submit:"Submit enquiry", sending:"Sending your enquiry…"
    },
    th:{
      title:"ลงทะเบียนความสนใจ", lead:"กรุณากรอกข้อมูลเกี่ยวกับอสังหาริมทรัพย์ที่ท่านกำลังมองหา แล้วทีมงานของเราจะติดต่อกลับ",
      secClient:"ข้อมูลของท่าน", first:"ชื่อ", last:"นามสกุล", phone:"เบอร์โทรศัพท์", email:"อีเมล", chat:"LINE / WhatsApp ID",
      pref:"ช่องทางที่สะดวกให้ติดต่อ", prefCall:"โทรศัพท์", prefEmail:"อีเมล",
      secIntent:"สนใจ", buy:"ซื้อ", rent:"เช่า", intentHint:"กรุณาเลือก ซื้อ เช่า หรือทั้งสองอย่าง",
      beds:"จำนวนห้องนอน", budget:"งบประมาณ", budgetMonth:"งบประมาณต่อเดือน", thb:"บาท", thbMonth:"บาท / เดือน",
      bedNames:["สตูดิโอ","1 ห้องนอน","2 ห้องนอน","3 ห้องนอน","4+ ห้องนอน"],
      secType:"ประเภทอสังหาริมทรัพย์", condo:"คอนโดมิเนียม", house:"บ้าน / ทาวน์เฮาส์",
      secNotes:"เงื่อนไขเพิ่มเติม", notesHint:"ทำเลที่ต้องการ วันที่ต้องการเข้าอยู่ สัตว์เลี้ยง ที่จอดรถ หรืออื่น ๆ",
      secSig:"ลายมือชื่อ", sigHint:"เซ็นชื่อด้วยนิ้ว", clear:"ล้าง",
      consent:"ข้าพเจ้ายินยอมให้ บริษัท เน็กซ์สเปซ เรียลตี้ จำกัด เก็บข้อมูลนี้ และติดต่อข้าพเจ้าเกี่ยวกับอสังหาริมทรัพย์ที่ตรงกับความต้องการ",
      consentHint:"กรุณาทำเครื่องหมายเพื่อดำเนินการต่อ",
      formErr:"ยังกรอกข้อมูลที่จำเป็นไม่ครบ กรุณาตรวจสอบช่องที่เป็นสีแดงด้านบน", pdfErr:"เกิดข้อผิดพลาด กรุณาลองอีกครั้ง หรือติดต่อเราทาง LINE @NEXSPACE",
      submit:"ส่งข้อมูล", sending:"กำลังส่งข้อมูล…"
    }
  };
  const BEDS_EN = T.en.bedNames;
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang")==="th" ? "th" : params.get("lang")==="en" ? "en" : null;
  if (!lang){ try{ const s=localStorage.getItem("nx-lang"); if(s==="th"||s==="en") lang=s; }catch(e){} }
  if (!lang) lang = (navigator.language||"").toLowerCase().startsWith("th") ? "th" : "en";
  const t = k => T[lang][k];
  // Optional tracking from the link, e.g. ?agent=Fon&from=Romm%20Convent
  const AGENT = (params.get("agent")||"").slice(0,80), SOURCE = (params.get("from")||"").slice(0,120);

  document.querySelectorAll("[data-beds]").forEach(box=>{
    const k = box.dataset.beds;
    BEDS_EN.forEach((b,i)=>{
      const l = document.createElement("label"); l.className="chip";
      l.innerHTML = `<input type="checkbox" id="${k}Bed${i}" value="${b}"><span data-bed="${i}"></span>`;
      box.appendChild(l);
    });
  });

  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(el=>{ const v=T[lang][el.dataset.t]; if(typeof v==="string") el.textContent=v; });
    document.querySelectorAll("[data-bed]").forEach(el=>el.textContent=T[lang].bedNames[+el.dataset.bed]);
    $("#formErr").textContent = t("formErr");
    $("#lang-en").setAttribute("aria-pressed", lang==="en");
    $("#lang-th").setAttribute("aria-pressed", lang==="th");
    $("#today").textContent = new Date().toLocaleDateString(lang==="th"?"th-TH":"en-GB",{day:"numeric",month:"short",year:"numeric"});
  }
  function setLang(l){ lang=l; try{localStorage.setItem("nx-lang",l)}catch(e){} applyLang(); }
  $("#lang-en").addEventListener("click",()=>setLang("en"));
  $("#lang-th").addEventListener("click",()=>setLang("th"));
  applyLang();

  function syncPanels(){
    $("#buyPanel").hidden = !$("#wantBuy").checked;
    $("#rentPanel").hidden = !$("#wantRent").checked;
    if ($("#wantBuy").checked || $("#wantRent").checked) $("#intentHint").hidden = true;
  }
  $("#wantBuy").addEventListener("change", syncPanels);
  $("#wantRent").addEventListener("change", syncPanels);

  ["#buyBudget","#rentBudget"].forEach(id=>{
    $(id).addEventListener("input", e=>{
      const digits = e.target.value.replace(/[^\d]/g,"");
      e.target.value = digits ? Number(digits).toLocaleString("en-US") : "";
    });
  });

  // Signature pad
  const sig = $("#sig"), ctx = sig.getContext("2d");
  let drawing=false, hasSig=false, last=null;
  function sizeSig(){
    const r = sig.getBoundingClientRect(); if(!r.width) return;
    const dpr = window.devicePixelRatio||1;
    const keep = hasSig ? sig.toDataURL() : null;
    sig.width = Math.round(r.width*dpr); sig.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=2.4; ctx.strokeStyle="#1a2140";
    if (keep){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=keep; }
  }
  const pt = e => { const r=sig.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  sig.addEventListener("pointerdown", e=>{ drawing=true; last=pt(e); sig.setPointerCapture(e.pointerId); e.preventDefault(); });
  sig.addEventListener("pointermove", e=>{
    if(!drawing) return; const p=pt(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; hasSig=true;
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>sig.addEventListener(ev,()=>drawing=false));
  $("#sigClear").addEventListener("click", ()=>{ ctx.clearRect(0,0,sig.width,sig.height); hasSig=false; });
  let lastW = 0;
  window.addEventListener("resize", ()=>{ const w=sig.getBoundingClientRect().width; if(w!==lastW){ lastW=w; sizeSig(); } });
  sizeSig(); lastW = sig.getBoundingClientRect().width;

  const checked = sel => [...document.querySelectorAll(sel+" input:checked")].map(i=>i.value);
  function collect(){
    const v = id => $(id).value.trim();
    return {
      first:v("#first"), last:v("#last"),
      phone:(v("#cc")+" "+v("#phone")).trim(), email:v("#email"), chat:v("#chat"),
      pref:checked("#pref"),
      buy:$("#wantBuy").checked, rent:$("#wantRent").checked,
      buyBeds:checked('[data-beds="buy"]'), rentBeds:checked('[data-beds="rent"]'),
      buyBudget:v("#buyBudget"), rentBudget:v("#rentBudget"),
      ptype:checked("#ptype"), notes:v("#notes"),
      agent:AGENT, source:SOURCE || "Online form",
      lang, date:new Date()
    };
  }

  function validate(){
    let ok = true;
    document.querySelectorAll(".field[data-req]").forEach(f=>{
      const inp = f.querySelector("#first,#last,#phone");
      const bad = !inp.value.trim();
      f.classList.toggle("invalid", bad); if(bad) ok=false;
    });
    const intent = $("#wantBuy").checked || $("#wantRent").checked;
    $("#intentHint").hidden = intent; if(!intent) ok=false;
    $("#consentHint").hidden = $("#consent").checked; if(!$("#consent").checked) ok=false;
    $("#formErr").textContent = t("formErr");
    $("#formErr").hidden = ok;
    return ok;
  }
  document.querySelectorAll("#first,#last,#phone").forEach(i=>i.addEventListener("input",()=>i.closest(".field").classList.remove("invalid")));
  $("#consent").addEventListener("change",()=>{ if($("#consent").checked) $("#consentHint").hidden=true; });

  // ---------- PDF (drawn on canvas so Thai prints correctly) ----------
  async function buildPdf(d, sigUrl){
    try{ await Promise.all(['300 20px "Jost"','400 20px "Jost"','500 20px "Jost"','600 20px "Jost"','400 20px "Noto Sans Thai"'].map(f=>document.fonts.load(f, "ก"))); }catch(e){}
    const W=1240, H=1754, M=110;
    const c=document.createElement("canvas"); c.width=W; c.height=H;
    const g=c.getContext("2d");
    const NAVY="#1f2f8f", INK="#1a2140", MUTED="#5d6584", LINE="#c9cee0";
    const F = (w,s)=>`${w} ${s}px Jost, "Noto Sans Thai", "Helvetica Neue", Arial, Thonburi, sans-serif`;
    g.fillStyle="#fff"; g.fillRect(0,0,W,H);
    g.strokeStyle=NAVY; g.lineWidth=4; g.strokeRect(60,60,W-120,H-120);
    g.textAlign="center"; g.fillStyle=NAVY; g.font=F(500,22);
    g.fillText("N E X S P A C E   R E A L T Y", W/2, 150);
    g.fillStyle=INK; g.font=F(300,56); g.fillText("ENQUIRY REGISTRATION", W/2, 225);
    g.textAlign="left";
    let y=310;
    function heading(txt){ g.fillStyle=INK; g.font=F(600,22); g.fillText(txt.toUpperCase(), M, y); y+=16;
      g.strokeStyle=LINE; g.lineWidth=1.5; g.beginPath(); g.moveTo(M,y); g.lineTo(W-M,y); g.stroke(); y+=44; }
    function wrap(text, maxW){
      const out=[]; String(text).split(/\n/).forEach(par=>{
        const words=par.split(/(\s+)/); let line="";
        words.forEach(w=>{ const tt=line+w; if(g.measureText(tt).width>maxW && line.trim()){ out.push(line.trim()); line=w.trimStart(); } else line=tt; });
        out.push(line.trim());
      }); return out;
    }
    function row(label, value, x, w){
      g.fillStyle=MUTED; g.font=F(400,20); g.fillText(label, x, y);
      g.fillStyle=INK; g.font=F(400,28);
      const lines = wrap(value||"—", w); lines.slice(0,4).forEach((l,i)=>g.fillText(l, x, y+38+i*36));
      return 38 + Math.min(lines.length,4)*36;
    }
    const colW=(W-2*M-60)/2, x2=M+colW+60;
    function pair(l1,v1,l2,v2){ const h=Math.max(row(l1,v1,M,colW), row(l2,v2,x2,colW)); y+=h+26; }
    function full(l,v){ const h=row(l,v,M,W-2*M); y+=h+26; }

    heading("Client details  ·  ข้อมูลลูกค้า");
    pair("First name / ชื่อ", d.first, "Last name / นามสกุล", d.last);
    pair("Phone / โทรศัพท์", d.phone, "Email / อีเมล", d.email);
    pair("LINE / WhatsApp ID", d.chat, "Best way to reach / ช่องทางติดต่อ", d.pref.join(", "));
    heading("Interested  ·  ความสนใจ");
    full("Property type / ประเภท", d.ptype.join(", ") || "Not specified");
    pair("Buy (bedroom) / ซื้อ", d.buy ? (d.buyBeds.join(", ")||"Any size") : "—", "Rent (bedroom) / เช่า", d.rent ? (d.rentBeds.join(", ")||"Any size") : "—");
    pair("Buy budget (THB) / งบซื้อ", d.buy ? (d.buyBudget||"Not given") : "—", "Rent budget (THB / month) / งบเช่า", d.rent ? (d.rentBudget||"Not given") : "—");
    heading("Additional conditions  ·  เงื่อนไขเพิ่มเติม");
    full("Notes / หมายเหตุ", d.notes);

    y = Math.max(y, 1300);
    g.fillStyle=MUTED; g.font=F(400,20); g.fillText("Client signature / ลายมือชื่อ", M, y);
    g.fillText("Date / วันที่", x2, y);
    if (sigUrl){ const im=await new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=sigUrl;});
      if(im){ const h=110, w=Math.min(colW, im.width*(h/im.height)); g.drawImage(im, M, y+12, w, h); } }
    g.strokeStyle=INK; g.lineWidth=1.5; g.beginPath(); g.moveTo(M,y+135); g.lineTo(M+colW,y+135); g.stroke();
    g.fillStyle=INK; g.font=F(400,28);
    g.fillText(d.date.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+"  ·  "+d.date.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}), x2, y+80);
    g.beginPath(); g.moveTo(x2,y+135); g.lineTo(W-M,y+135); g.stroke();
    y += 190;
    g.fillStyle=MUTED; g.font=F(400,20);
    g.fillText("Agent / referred by:  " + (d.agent||"—"), M, y);
    g.fillText("Source:  " + (d.source||"—"), x2, y);
    y+=34; g.font=F(400,18);
    g.fillText("Client agreed to be contacted by Nexspace Realty about matching properties.  ·  Form language: " + (d.lang==="th"?"Thai":"English"), M, y);
    g.textAlign="center"; g.fillStyle=NAVY; g.font=F(500,20);
    g.fillText("NEXSPACE REALTY CO., LTD   ·   +66 64 164 2459   ·   LINE @NEXSPACE", W/2, H-100);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"mm", format:"a4", compress:true});
    pdf.addImage(c.toDataURL("image/jpeg",0.9), "JPEG", 0, 0, 210, 297);
    pdf.setProperties({title:`Enquiry - ${d.first} ${d.last}`, author:"Nexspace Realty"});
    return pdf.output("blob");
  }

  // ---------- Deliver by email ----------
  function addField(name, value){
    const i=document.createElement("input"); i.type="hidden"; i.name=name; i.value=value||"—";
    $("#m_fields").appendChild(i);
  }
  $("#f").addEventListener("submit", async e=>{
    e.preventDefault();
    if(!validate()){ const first=document.querySelector(".field.invalid input, #intentHint:not([hidden]), #consentHint:not([hidden])"); first && first.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const btn=$("#submitBtn"); btn.disabled=true;
    $("#sendingText").textContent=t("sending"); $("#sending").hidden=false;
    try{
      const d=collect();
      $("#m_fields").innerHTML="";
      addField("Name", `${d.first} ${d.last}`);
      addField("Phone", d.phone);
      addField("Email", d.email);
      addField("LINE / WhatsApp", d.chat);
      addField("Best way to reach", d.pref.join(", "));
      addField("Property type", d.ptype.join(", "));
      addField("Buy", d.buy ? `Yes · ${d.buyBeds.join(", ")||"Any size"} · Budget ${d.buyBudget ? d.buyBudget+" THB" : "not given"}` : "No");
      addField("Rent", d.rent ? `Yes · ${d.rentBeds.join(", ")||"Any size"} · Budget ${d.rentBudget ? d.rentBudget+" THB / month" : "not given"}` : "No");
      addField("Additional conditions", d.notes);
      addField("Agent / referred by", d.agent);
      addField("Source", d.source);
      addField("Form language", d.lang==="th" ? "Thai" : "English");
      addField("Signed", hasSig ? "Yes (see attached PDF)" : "No signature");
      addField("Submitted", d.date.toLocaleString("en-GB",{timeZone:"Asia/Bangkok",dateStyle:"medium",timeStyle:"short"})+" (Bangkok)");
      $("#m_subject").value = `New enquiry: ${d.first} ${d.last}` + (d.buy&&d.rent ? " (Buy + Rent)" : d.buy ? " (Buy)" : " (Rent)");
      $("#m_next").value = new URL("thanks.html?lang="+d.lang, location.href).href;

      // Attach the PDF; if this browser can't attach files, the email still carries every answer.
      try{
        const blob = await buildPdf(d, hasSig ? sig.toDataURL("image/png") : null);
        const safe = s => s.replace(/[\\/:*?"<>|]+/g,"").trim();
        const file = new File([blob], `Nexspace Enquiry - ${safe(d.first)} ${safe(d.last)} - ${d.date.toISOString().slice(0,10)}.pdf`, {type:"application/pdf"});
        const dt = new DataTransfer(); dt.items.add(file); $("#m_file").files = dt.files;
      }catch(err){ $("#m_file").value=""; }

      try{ localStorage.setItem("nx-lang", d.lang); }catch(e){}
      HTMLFormElement.prototype.submit.call($("#mailer"));
    }catch(err){
      $("#sending").hidden=true; btn.disabled=false;
      $("#formErr").textContent=t("pdfErr"); $("#formErr").hidden=false;
    }
  });
  // Coming back with the browser's back button: clear the overlay
  window.addEventListener("pageshow", ()=>{ $("#sending").hidden=true; $("#submitBtn").disabled=false; });
})();
</script>
</body>
