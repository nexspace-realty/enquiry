<style>
/* Layout: one calm column on a white page, sized for an iPad in portrait; big touch targets, section labels like the paper form. Single light look by choice. */
:root{
  --bg:#ffffff; --paper:#ffffff; --ink:#1a2140; --muted:#5d6584; --line:#d5d9e6;
  --navy:#1f2f8f; --navy-soft:#eef0fa; --ok:#1f7a4d; --err:#b3261e;
  --display:"Jost", "Noto Sans Thai", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --body:"Jost", "Noto Sans Thai", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.langbar{display:flex;justify-content:flex-end}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden}
.seg button{min-height:44px;padding:0 20px;border:0;background:transparent;color:var(--navy);font-size:16px;font-family:var(--body)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sheet{background:var(--paper);border:2px solid var(--navy);border-radius:4px;padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:30px}
header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand{font-size:13px;letter-spacing:.28em;font-weight:500;color:var(--navy);text-transform:uppercase}
h1{font-family:var(--display);font-weight:300;font-size:clamp(28px,5vw,40px);letter-spacing:.06em;margin:0;text-wrap:balance}
html[lang="th"] h1{letter-spacing:0;font-weight:400}
.lead{color:var(--muted);margin:0;font-size:15px}
section{display:flex;flex-direction:column;gap:14px}
.label{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
html[lang="th"] .label{letter-spacing:.02em;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;color:var(--muted)}
.req{color:var(--navy)}
input[type=text],input[type=tel],input[type=email],textarea{
  font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);
  padding:10px 2px;border-radius:0;width:100%;outline:none;-webkit-appearance:none;appearance:none}
textarea{border:1.5px solid var(--line);border-radius:6px;padding:12px;min-height:96px;resize:vertical}
input:focus,textarea:focus{border-color:var(--navy)}
.field.invalid input{border-color:var(--err)}
.hint{font-size:13px;color:var(--err)}
.phone{display:grid;grid-template-columns:120px 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:64px;padding:0 20px;
  border:1.5px solid var(--line);border-radius:999px;font-size:17px;user-select:none;transition:background .15s,border-color .15s;background:#fff}
.chip input:checked + span{background:var(--navy);border-color:var(--navy);color:#fff}
.chip input:focus-visible + span{outline:3px solid var(--navy-soft);outline-offset:2px}
.panel{border:1.5px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--navy-soft)}
.panel h3{margin:0;font-weight:500;font-size:17px}
.money{display:flex;align-items:center;gap:10px}
.money .unit{font-size:14px;color:var(--muted);white-space:nowrap}
.sig-box{border:1.5px dashed var(--line);border-radius:10px;position:relative;touch-action:none;background:#fff}
#sig{display:block;width:100%;height:170px}
.sig-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--muted)}
.consent input{width:26px;height:26px;flex:none;accent-color:var(--navy);margin-top:1px}
button{font:inherit;cursor:pointer}
.btn{min-height:56px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-size:18px;font-weight:500;letter-spacing:.04em;padding:0 32px}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn:focus-visible,.link:focus-visible,.seg button:focus-visible{outline:3px solid #b9c2ef;outline-offset:3px}
.link{background:none;border:0;color:var(--navy);font-size:14px;padding:6px 0;text-decoration:underline}
.actions{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.formerr{color:var(--err);font-size:15px;text-align:center}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.staff{border-top:1px dashed var(--line);padding-top:22px}
.staff .label{color:var(--muted)}
.done{text-align:center;align-items:center}
.tick{width:72px;height:72px;border-radius:50%;background:var(--navy-soft);display:grid;place-items:center;color:var(--navy);font-size:34px}
.done h2{font-weight:400;font-size:28px;margin:0}
.done p{margin:0;color:var(--muted);max-width:52ch}
.send{width:100%;max-width:520px;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.send ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink);font-size:15px}
.rcpt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rcpt code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--navy-soft);padding:6px 10px;border-radius:6px;user-select:all;word-break:break-all}
.status{font-size:14px;min-height:20px}
.status.ok{color:var(--ok)} .status.bad{color:var(--err)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
input[type=date]{font:inherit;font-size:18px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;min-height:48px;width:100%}
input[type=date]:focus{border-color:var(--navy);outline:none}
.sending{position:fixed;inset:0;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:20;text-align:center;padding:24px}
.sending div{display:flex;flex-direction:column;gap:14px;align-items:center;color:var(--ink);font-size:18px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--navy-soft);border-top-color:var(--navy);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<style>
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px 20px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 .field:first-child{grid-column:1/-1}}
.terms{border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;font-size:15px;color:var(--ink);background:#fff;display:flex;flex-direction:column;gap:6px}
.terms ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.terms p{margin:0}
.sub{font-size:14px;color:var(--muted)}
.sig-box.invalid{border-color:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <div class="seg" role="group" aria-label="Language / ภาษา">
      <button type="button" id="lang-en" aria-pressed="true">English</button>
      <button type="button" id="lang-th" aria-pressed="false">ภาษาไทย</button>
    </div>
  </div>

  <form id="f" class="sheet" novalidate autocomplete="on">
    <header>
      <div class="brand">Nexspace Realty</div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
    </header>

    <!-- OWNER DETAILS -->
    <section>
      <div class="label" data-t="secOwner"></div>
      <div class="grid">
        <div class="field" data-req><label for="first"><span data-t="first"></span> <span class="req">*</span></label><input id="first" type="text" autocomplete="given-name" autocapitalize="words"></div>
        <div class="field" data-req><label for="last"><span data-t="last"></span> <span class="req">*</span></label><input id="last" type="text" autocomplete="family-name" autocapitalize="words"></div>
        <div class="field" data-req style="grid-column:1/-1"><label for="phone"><span data-t="phone"></span> <span class="req">*</span></label>
          <div class="phone">
            <input id="cc" type="tel" value="+66" inputmode="tel" aria-label="Country code">
            <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="81 234 5678">
          </div>
        </div>
        <div class="field"><label for="email" data-t="email"></label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <div class="field"><label for="chat" data-t="chat"></label><input id="chat" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"></div>
      </div>
      <div class="field"><label data-t="pref"></label>
        <div class="chips" id="pref">
          <label class="chip"><input type="checkbox" value="Phone call"><span data-t="prefCall"></span></label>
          <label class="chip"><input type="checkbox" value="LINE"><span>LINE</span></label>
          <label class="chip"><input type="checkbox" value="WhatsApp"><span>WhatsApp</span></label>
          <label class="chip"><input type="checkbox" value="Email"><span data-t="prefEmail"></span></label>
        </div>
      </div>
    </section>

    <!-- PROPERTY NAME -->
    <section>
      <div class="label"><span data-t="secName"></span> <span class="req">*</span></div>
      <div class="chips" id="ptype">
        <label class="chip"><input type="radio" name="ptype" value="Condominium"><span data-t="condo"></span></label>
        <label class="chip"><input type="radio" name="ptype" value="House / Townhouse"><span data-t="house"></span></label>
      </div>
      <div class="hint" id="ptypeHint" data-t="ptypeHint" hidden></div>
      <div class="field" id="projectField"><label for="project"><span id="projectLbl"></span> <span class="req">*</span></label>
        <input id="project" type="text" autocapitalize="words">
        <div class="hint" id="projectHint" data-t="projectHint" hidden></div></div>
    </section>

    <!-- PROPERTY DETAILS -->
    <section>
      <div class="label" data-t="secDetails"></div>
      <div class="grid3">
        <div class="field" id="unitField"><label for="unit"><span data-t="unit"></span> <span class="req">*</span></label><input id="unit" type="text"><div class="hint" id="unitHint" data-t="unitHint" hidden></div></div>
        <div class="field"><label for="area" data-t="area"></label><div class="money"><input id="area" type="text" inputmode="decimal"><span class="unit" data-t="sqm"></span></div></div>
        <div class="field"><label for="floor" data-t="floor"></label><input id="floor" type="text" inputmode="numeric"></div>
      </div>
      <div class="field"><label data-t="beds"></label><div class="chips" id="beds"></div></div>
      <div class="field"><label data-t="baths"></label><div class="chips" id="baths"></div></div>
      <div class="grid">
        <div class="field"><label data-t="maid"></label><div class="chips" id="maid">
          <label class="chip"><input type="radio" name="maid" value="Yes"><span data-t="yes"></span></label>
          <label class="chip"><input type="radio" name="maid" value="No"><span data-t="no"></span></label></div></div>
        <div class="field"><label data-t="parking"></label><div class="chips" id="parking"></div></div>
      </div>
    </section>

    <!-- PRICE -->
    <section>
      <div class="label"><span data-t="secPrice"></span> <span class="req">*</span></div>
      <div class="chips" id="intent">
        <label class="chip"><input id="wantSale" type="checkbox" value="sale"><span data-t="sale"></span></label>
        <label class="chip"><input id="wantRent" type="checkbox" value="rent"><span data-t="rent"></span></label>
      </div>
      <div class="hint" id="intentHint" data-t="intentHint" hidden></div>

      <div class="panel" id="salePanel" hidden>
        <h3 data-t="sale"></h3>
        <div class="field" id="salePriceField"><label for="salePrice"><span data-t="salePrice"></span> <span class="req">*</span></label>
          <div class="money"><input id="salePrice" type="text" inputmode="numeric" placeholder="e.g. 8,500,000"><span class="unit" data-t="thb"></span></div>
          <div class="hint" id="salePriceHint" data-t="priceHint" hidden></div></div>
        <div class="field"><label data-t="tf"></label><div class="chips" id="tf">
          <label class="chip"><input type="radio" name="tf" value="Split 50/50"><span data-t="tf5050"></span></label>
          <label class="chip"><input type="radio" name="tf" value="Buyer pays all"><span data-t="tfBuyer"></span></label>
          <label class="chip"><input type="radio" name="tf" value="Seller pays all"><span data-t="tfSeller"></span></label>
          <label class="chip"><input type="radio" name="tf" value="Negotiable"><span data-t="nego"></span></label></div></div>
      </div>

      <div class="panel" id="rentPanel" hidden>
        <h3 data-t="rent"></h3>
        <div class="field" id="rentPriceField"><label for="rentPrice"><span data-t="rentPrice"></span> <span class="req">*</span></label>
          <div class="money"><input id="rentPrice" type="text" inputmode="numeric" placeholder="e.g. 45,000"><span class="unit" data-t="thbMonth"></span></div>
          <div class="hint" id="rentPriceHint" data-t="priceHint" hidden></div></div>
        <div class="field"><label data-t="pet"></label><div class="chips" id="pet">
          <label class="chip"><input type="radio" name="pet" value="Allowed"><span data-t="petYes"></span></label>
          <label class="chip"><input type="radio" name="pet" value="Not allowed"><span data-t="petNo"></span></label>
          <label class="chip"><input type="radio" name="pet" value="Negotiable"><span data-t="nego"></span></label></div></div>
      </div>
      <div class="field"><label for="net" data-t="net"></label>
        <div class="money"><input id="net" type="text" inputmode="numeric"><span class="unit" data-t="thb"></span></div>
        <span class="sub" data-t="netSub"></span></div>
    </section>

    <!-- ADDITIONAL CONDITION -->
    <section>
      <div class="label" data-t="secCond"></div>
      <div class="field"><label data-t="furn"></label><div class="chips" id="furn">
        <label class="chip"><input type="radio" name="furn" value="Fully furnished"><span data-t="furnFull"></span></label>
        <label class="chip"><input type="radio" name="furn" value="Partly furnished"><span data-t="furnPart"></span></label>
        <label class="chip"><input type="radio" name="furn" value="Unfurnished"><span data-t="furnNone"></span></label></div></div>
      <div class="field"><label for="appliances" data-t="appliances"></label><input id="appliances" type="text"></div>
      <div class="field"><label data-t="direction"></label><div class="chips" id="direction"></div></div>
      <div class="field"><label data-t="key"></label><div class="chips" id="key">
        <label class="chip"><input type="radio" name="key" value="With owner"><span data-t="keyOwner"></span></label>
        <label class="chip"><input type="radio" name="key" value="With building office"><span data-t="keyOffice"></span></label>
        <label class="chip"><input type="radio" name="key" value="Given to Nexspace"><span data-t="keyNx"></span></label>
        <label class="chip"><input type="radio" name="key" value="Tenant occupied"><span data-t="keyTenant"></span></label></div></div>
      <div class="field"><label for="notes" data-t="notes"></label><textarea id="notes"></textarea></div>
    </section>

    <!-- AUTHORISATION -->
    <section>
      <div class="label" data-t="secAuth"></div>
      <div class="terms">
        <p data-t="authText"></p>
        <p data-t="commTitle"></p>
        <ul><li data-t="commSale"></li><li data-t="commLease"></li></ul>
      </div>
      <div class="sig-box" id="sigBox"><canvas id="sig" aria-label="Signature"></canvas></div>
      <div class="sig-row"><span data-t="sigHint"></span><button type="button" class="link" id="sigClear" data-t="clear"></button></div>
      <div class="hint" id="sigHint" data-t="sigReq" hidden></div>
      <label class="consent"><input id="consent" type="checkbox"><span data-t="consent"></span></label>
      <div class="hint" id="consentHint" data-t="consentHint" hidden></div>
    </section>

    <div class="actions">
      <div class="formerr" id="formErr" hidden></div>
      <button class="btn" type="submit" id="submitBtn" data-t="submit"></button>
    </div>

    <footer><span>Nexspace Realty Co., Ltd · +66 64 164 2459 · LINE @NEXSPACE</span><span id="today"></span></footer>
  </form>
</div>

<!-- Fallback delivery by email -->
<form id="mailer" action="https://formsubmit.co/nathita.t@nexspace-realty.com" method="POST" enctype="multipart/form-data" hidden>
  <input type="hidden" name="_cc" value="piriya.t@nexspace-realty.com">
  <input type="hidden" name="_subject" id="m_subject" value="New owner listing">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" id="m_next" value="">
  <div id="m_fields"></div>
  <input type="file" name="attachment" id="m_file" accept="application/pdf">
</form>

<div class="sending" id="sending" hidden><div><span class="spin" aria-hidden="true"></span><span id="sendingText"></span></div></div>

      g.strokeStyle=LINE; g.lineWidth=1.5; g.beginPath(); g.moveTo(M,y); g.lineTo(W-M,y); g.stroke(); y+=34; }
    function wrap(text, maxW){
      const out=[]; String(text).split(/\n/).forEach(par=>{
        const words=par.split(/(\s+)/); let line="";
        words.forEach(w=>{ const tt=line+w; if(g.measureText(tt).width>maxW && line.trim()){ out.push(line.trim()); line=w.trimStart(); } else line=tt; });
        out.push(line.trim());
      }); return out;
    }
    function cell(label, value, x, w, maxLines){
      g.fillStyle=MUTED; g.font=F(400,18); g.fillText(label, x, y);
      g.fillStyle=INK; g.font=F(400,25);
      const lines = wrap(value||"—", w); const n = maxLines||2; let shown = lines.slice(0,n);
      if (lines.length > n) { let l = shown[n-1]; while (l && g.measureText(l+" …").width > w) l = l.slice(0,-1); shown[n-1] = l+" …"; }

      return 33 + shown.length*31;
    }
    const gap=40, inner=W-2*M;
    function rowN(items){ const n=items.length, cw=(inner-gap*(n-1))/n; let h=0;

    heading("Property name  ·  ชื่อโครงการ");
    rowN([["Type / ประเภท", d.ptype],["Name / ชื่อ", d.project]]);
    heading("Property details  ·  รายละเอียดทรัพย์");
    rowN([["Unit no. / Address no.", d.unit],["Area / พื้นที่", d.area ? d.area+" sq m" : ""],["Floor / ชั้น", d.floor]]);
    rowN([["Bedroom", d.beds],["Bathroom", d.baths],["Maid", d.maid],["Parking", d.parking]]);

    rowN([["Appliances / เครื่องใช้ไฟฟ้า", d.appliances]]);
    const notesLines = Math.max(1, Math.min(4, Math.floor((1330 - y - 33) / 31)));

    const colW=(inner-60)/2, x2=M+colW+60;
    g.fillStyle=MUTED; g.font=F(400,18); g.fillText("Owner signature / ลายมือชื่อเจ้าของ", M, y); g.fillText("Date / วันที่", x2, y);
    if (sigUrl){ const im=await new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=sigUrl;});
      if(im){ const h=86, w=Math.min(colW, im.width*(h/im.height)); g.drawImage(im, M, y+8, w, h); } }

    g.beginPath(); g.moveTo(x2,y+104); g.lineTo(W-M,y+104); g.stroke();
    y += 140;
    g.fillStyle=MUTED; g.font=F(400,17);
    g.fillText("Agent:  " + (d.agent||"—") + "   ·   Source:  " + (d.source||"—") + "   ·   Form language: " + (d.lang==="th"?"Thai":"English") + "   ·   Owner ticked agreement to terms", M, y);

    ].filter(Boolean).join("\n");
    return {
      "Submitted": d.date.toLocaleString("en-GB",{timeZone:"Asia/Bangkok",dateStyle:"medium",timeStyle:"short"})+" (Bangkok)",
      "Name": `${d.first} ${d.last}`, "Phone": d.phone, "Email": d.email, "LINE / WhatsApp": d.chat, "Best way to reach": d.pref.join(", "),
      "Property type": d.ptype, "Property name": d.project, "Unit / Address no.": d.unit,
      "Area (sq m)": d.area, "Floor": d.floor, "Bedroom": d.beds, "Bathroom": d.baths, "Maid": d.maid, "Parking": d.parking,
      "Listing": listing, "Resale price (THB)": d.sale ? d.salePrice : "", "Rental price (THB / month)": d.rent ? d.rentPrice : "",
      "Net price (THB)": d.net, "Furnished": d.furn, "Appliances": d.appliances, "Direction": d.direction.join(", "),
      "Key": d.key, "Pet": d.rent ? d.pet : "", "TF expenses": d.sale ? d.tf : "",
      "Additional conditions": `${d.project} ${d.unit} · ${listing}` + (cond ? "\n"+cond : ""),
      "Agent / referred by": d.agent, "Source": d.source, "Form language": d.lang==="th" ? "Thai" : "English",
      "Signed": hasSig ? "Yes, terms accepted (see attached PDF)" : "No signature"
    };
  }

  $("#f").addEventListener("submit", async e=>{
    e.preventDefault();
    if(!validate()){ const first=document.querySelector(".field.invalid input, .hint:not([hidden])"); first && first.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const btn=$("#submitBtn"); btn.disabled=true; $("#formErr").hidden=true;
    $("#sendingText").textContent=t("sending"); $("#sending").hidden=false;
    let d, fields, subject, blob=null, filename="";
    try{
      d=collect(); fields=buildFields(d);
      subject = `New owner listing: ${d.project} ${d.unit} (${[d.sale&&"Sale",d.rent&&"Rent"].filter(Boolean).join(" + ")}) – ${d.first} ${d.last}`;
      try{
        blob = await buildPdf(d, hasSig ? sig.toDataURL("image/png") : null);
        const safe = s => s.replace(/[\\/:*?"<>|]+/g,"").trim();
        filename = `Nexspace Property Registration - ${safe(d.project)} ${safe(d.unit)} - ${d.date.toISOString().slice(0,10)}.pdf`;
      }catch(err){ blob=null; }
      try{ localStorage.setItem("nx-lang", d.lang); }catch(e){}
    }catch(err){ showSendError(); return; }

    const thanksUrl = new URL("thanks.html?lang="+d.lang, location.href).href;

    if (ENDPOINT) {
      const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 45000);
      try{
        const payload = { form:"owner", fields, subject, filename, pdfBase64: blob ? await blobToBase64(blob) : "" };
        const r = await fetch(ENDPOINT, { method:"POST", body: JSON.stringify(payload), headers:{ "Content-Type":"text/plain;charset=utf-8" }, signal: ctrl.signal, redirect:"follow", credentials:"omit" });
        const out = await r.json().catch(()=>({}));
        clearTimeout(timer);
        if (out && out.ok) { location.href = thanksUrl; return; }
        showSendError(); return;
      }catch(err){ clearTimeout(timer); showSendError(); return; }
    }

    try{
      $("#m_fields").innerHTML="";
      Object.entries(fields).forEach(([k,v])=>addField(k,v));
      $("#m_subject").value = subject; $("#m_next").value = thanksUrl;
      if (blob) { try{ const dt = new DataTransfer(); dt.items.add(new File([blob], filename, {type:"application/pdf"})); $("#m_file").files = dt.files; }catch(err){ $("#m_file").value=""; } }
      HTMLFormElement.prototype.submit.call($("#mailer"));
    }catch(err){ showSendError(); }
  });
  window.addEventListener("pageshow", ()=>{ $("#sending").hidden=true; $("#submitBtn").disabled=false; });
})();
</script>
</body>
</html>
